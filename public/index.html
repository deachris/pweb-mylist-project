<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLIST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="header">
            <div class="web-name">
                MyLIST
            </div>
            <div class="nav-bar">
                <h2 class="active" data-category="All">All</h2>
                <h2 data-category="Film">Film</h2>
                <h2 data-category="Series">Series</h2>
                <h2 data-category="Books">Books</h2>
            </div>
        </div>
        <div class="container">
            <form id="form-search">
                <input id="search-title" placeholder="Search title...">
                <button type="submit">Search</button>
            </form>
            <form id="form-item">
                <div class="form-head">
                    <h2 id="form-label">Add Item</h2>
                </div>
                <input type="hidden" id="input-id">
                <div class="form-grid">
                    <input id="input-title" placeholder="Title" required>
                    <select id="input-category" required>
                        <option value="Film">Film</option>
                        <option value="Series">Series</option>
                        <option value="Books">Books</option>
                    </select>
                    <input id="input-genre" placeholder="Genre">
                    <input id="input-rating" type="number" min="0" max="10" step="0.1" placeholder="Rating">
                    <select id="input-status" required>
                        <option value="not-started">Not Started</option>
                        <option value="in-progress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" id="btn-save">Add</button>
                    <button type="button" id="btn-cancel">Cancel</button>
                </div>
            </form>
            <div class="display" id="display"></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
